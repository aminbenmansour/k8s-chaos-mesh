apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: rook-ceph-operator
  namespace: rook-ceph
spec:
  values:
    csi:
      csiRBDProvisionerResource: |
        - name : csi-provisioner
          resource:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
        - name : csi-attacher
          resource:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
        - name : csi-resizer
          resource:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
      
      csiRBDPluginResource: |
        - name : driver-registrar
          resource:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
        - name : csi-rbdplugin
          resource:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi