apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  values:
    cephClusterSpec:
      mon:
        count: 1
      mgr:
        count: 1

      resources:
        mon:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            memory: "512Mi"
        mgr:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            memory: "512Mi"
        osd:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            memory: "2Gi"

    # This defines a Ceph pool used by RBD (block storage).
    # PVCs using `rook-ceph-block` → use this pool
    # -> Databases, StatefulSets, etc. depend on this
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          # This tells Ceph what “failure” means. (host = a Kubernetes node)
          # Ceph will try to put replicas on different nodes
          failureDomain: host
          # replication factor, ONE copy of data for staging
          replicated:
            size: 1
    
    cephObjectStores:
      - name: ceph-objectstore
        spec:
          gateway:
            port: 80
            instances: 1
            resources:
              limits:
                memory: "1Gi"
              requests:
                cpu: "200m"
                memory: "512Mi"
    
    cephFileSystems:
      - name: ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 1
          dataPools:
            - name: data0
              replicated:
                size: 1
          metadataServer:
            activeCount: 1
            activeStandby: false    
