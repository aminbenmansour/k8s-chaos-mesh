apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/rook-ceph-cluster

patches:
  - path: patch.yaml
    target:
      kind: HelmRelease
      name: rook-ceph-cluster
      namespace: rook-ceph
  - path: patch-resources.yaml
    target:
      kind: HelmRelease
      name: rook-ceph-cluster
      namespace: rook-ceph